{% extends 'base.html' %}
{% load static %}
{% block title %}{{ title }} - Campus Marketplace{% endblock %}

{% block content %}

<section class="heading-page header-text" id="top">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h6>Get all details</h6>
        </div>
      </div>
    </div>
  </section>
   
<section class="meetings-page" id="meetings">
    <div class="container">
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 font-weight-bold">{{ title }}</h3>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label w-100">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary flex-grow-1 fw-bold">Save Listing</button>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


</div>
</section>

{% endblock %}
